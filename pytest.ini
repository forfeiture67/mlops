[pytest]
testpaths = hw04/tests hw05/tests
addopts = -ra --strict-markers
pythonpath = .
markers =
    unit: isolated blocks and model contracts
    data: dataset and dataloader contracts
    integration: interaction between pipeline components
    training: optimisation and learning behaviour
    e2e: subprocess run from data loading to saved artifacts
    property: generated valid inputs
    tracking: MLflow persistence and model reload
